[project]
name = "identity-service"
version = "0.1.0"
description = "Identity Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
    "passlib>=1.7.4",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt[crypto]>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "B008",    # Do not perform function call `Depends` in argument defaults (standard in FastAPI)
    "DTZ003",  # datetime.datetime.utcnow() used (acceptable for our simple tracking)
    "BLE001",  # Do not catch blind exception (ok for our global error handler)
    "TRY201",  # Use raise without specifying exception name (ok for FastAPI handler)
    "UP017",   # datetime.timezone.utc used across tests and codebase
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"