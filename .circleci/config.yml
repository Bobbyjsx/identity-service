version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
      - image: google/cloud-sdk:latest
        command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
        environment:
          FIRESTORE_PROJECT_ID: test-project

    steps:
      - checkout

      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - v1-uv-cache-{{ checksum "uv.lock" }}
            - v1-uv-cache-

      - run:
          name: Sync Dependencies with uv
          command: |
            uv sync --frozen

      - save_cache:
          key: v1-uv-cache-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

      - run:
          name: Wait for Firestore Emulator
          command: |
            for i in $(seq 1 30); do
              if nc -z 127.0.0.1 8080 2>/dev/null || curl -s http://127.0.0.1:8080/ >/dev/null 2>&1; then
                echo "Firestore emulator is ready!"
                exit 0
              fi
              sleep 1
            done

            echo "Timeout waiting for emulator"
            exit 1

      - run:
          name: Run Tests
          command: |
            cp -n .env.example .env || true
            make test

  deploy-prod:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Set Environment Variables
          command: |
            echo "export DEPLOY_VERSION=${CIRCLE_SHA1}" >> "$BASH_ENV"
            echo "export SERVICE_NAME=identity-service" >> "$BASH_ENV"
            echo "export REGISTRY_IMAGE=gcr.io/${GCP_PROJECT_ID}/identity-service" >> "$BASH_ENV"
            echo "export ENV_DECLARATION_FILE=.env.example" >> "$BASH_ENV"
            # deploy-ops uses these to authenticate
            echo "export REGISTRY_USERNAME=_json_key" >> "$BASH_ENV"
            echo "export REGISTRY_PASSWORD=$(echo \"$GCP_SERVICE_KEY\" | base64 -d)" >> "$BASH_ENV"
      - run:
          name: Clone deploy-ops
          command: git clone --branch main https://github.com/Bobbyjsx/deploy-ops.git
      - run:
          name: Build and Deploy
          command: |
            cd deploy-ops
            make build
            make deploy

workflows:
  version: 2

  build-and-deploy:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
                - master

      - deploy-prod:
          context: 
            - identity-service
            - deploy-ops
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - master
