version: 2.1

jobs:
  test:
    machine:
      image: ubuntu-2204:default
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-uv-cache-{{ checksum "uv.lock" }}
            - v1-uv-cache-
      - run:
          name: Sync Dependencies with uv
          command: |
            uv sync --frozen
      - save_cache:
          key: v1-uv-cache-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Run Tests
          command: |
            cp -n .env.example .env || true
            make test

  build-and-push:
    docker:
      - image: cimg/gcp:2024.01
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Authenticate with Google Container Registry
          command: |
            echo "$GCP_SERVICE_KEY" | base64 -d > /tmp/gcp-key.json
            gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
            gcloud config set project "$GCP_PROJECT_ID"
            gcloud auth configure-docker --quiet
      - run:
          name: Build and Push Docker Image
          command: |
            IMAGE_BASE="gcr.io/${GCP_PROJECT_ID}/identity-service"
            docker build \
              -t "${IMAGE_BASE}:latest" \
              -t "${IMAGE_BASE}:${CIRCLE_SHA1}" \
              .
            docker push "${IMAGE_BASE}:latest"
            docker push "${IMAGE_BASE}:${CIRCLE_SHA1}"

  trigger-deploy:
    docker:
      - image: cimg/base:2024.01
    steps:
      - run:
          name: Trigger Secure Container Deployment Webhook
          command: |
            # Call deployment webhook with per-container secret header.
            # If the secret is invalid or missing, server returns 401 Unauthorized and performs no action.
            HTTP_RESPONSE=$(curl -s -o /tmp/webhook_response.json -w "%{http_code}" \
              -X POST \
              -H "X-Webhook-Secret: ${DEPLOY_WEBHOOK_SECRET}" \
              "${DEPLOY_WEBHOOK_URL}")

            cat /tmp/webhook_response.json || true
            echo ""

            if [ "$HTTP_RESPONSE" -eq 200 ] || [ "$HTTP_RESPONSE" -eq 204 ]; then
              echo "Deployment webhook successfully accepted (HTTP $HTTP_RESPONSE)."
            else
              echo "Deployment webhook failed with HTTP $HTTP_RESPONSE."
              exit 1
            fi

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
                - master
      - build-and-push:
          context: identity-service
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - master
      - trigger-deploy:
          context: identity-service
          requires:
            - build-and-push
          filters:
            branches:
              only:
                - main
                - master
