version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
      - image: google/cloud-sdk:latest
        command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
        environment:
          FIRESTORE_PROJECT_ID: test-project

    steps:
      - checkout

      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - v1-uv-cache-{{ checksum "uv.lock" }}
            - v1-uv-cache-

      - run:
          name: Sync Dependencies with uv
          command: |
            uv sync --frozen

      - save_cache:
          key: v1-uv-cache-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

      - run:
          name: Wait for Firestore Emulator
          command: |
            for i in $(seq 1 30); do
              if nc -z 127.0.0.1 8080 2>/dev/null || curl -s http://127.0.0.1:8080/ >/dev/null 2>&1; then
                echo "Firestore emulator is ready!"
                exit 0
              fi
              sleep 1
            done

            echo "Timeout waiting for emulator"
            exit 1

      - run:
          name: Run Tests
          command: |
            cp -n .env.example .env || true
            make test

  build-and-push:
    docker:
      - image: cimg/base:current

    steps:
      - checkout

      - setup_remote_docker:
          version: default
          docker_layer_caching: true

      - run:
          name: Authenticate with Google Container Registry
          command: |
            echo "$GCP_SERVICE_KEY" | base64 -d | docker login -u _json_key --password-stdin https://gcr.io

      - run:
          name: Build and Push Docker Image
          command: |
            IMAGE_BASE="gcr.io/${GCP_PROJECT_ID}/identity-service"

            docker build \
              -t "${IMAGE_BASE}:latest" \
              -t "${IMAGE_BASE}:${CIRCLE_SHA1}" \
              .

            docker push "${IMAGE_BASE}:latest"
            docker push "${IMAGE_BASE}:${CIRCLE_SHA1}"

  trigger-deploy:
    docker:
      - image: cimg/base:current

    steps:
      - run:
          name: Trigger Secure Container Deployment Webhook
          command: |
            HTTP_RESPONSE=$(curl -s -o /tmp/webhook_response.json -w "%{http_code}" \
              -X POST \
              -H "X-Webhook-Secret: ${DEPLOY_WEBHOOK_SECRET}" \
              "${DEPLOY_WEBHOOK_URL}")

            cat /tmp/webhook_response.json || true
            echo ""

            if [ "$HTTP_RESPONSE" -eq 200 ] || [ "$HTTP_RESPONSE" -eq 204 ]; then
              echo "Deployment webhook successfully accepted (HTTP $HTTP_RESPONSE)."
            else
              echo "Deployment webhook failed with HTTP $HTTP_RESPONSE."
              exit 1
            fi

  tailscale-test:
    docker:
      - image: cimg/base:current

    steps:
      - run:
          name: Install Tailscale
          command: |
            curl -fsSL https://tailscale.com/install.sh | sh

      - run:
          name: Join Tailnet
          command: |
            sudo tailscale up \
              --authkey="${TAILSCALE_AUTH_KEY}" \
              --hostname="circleci-deploy-test" \
              --ephemeral

      - run:
          name: Verify Tailnet
          command: |
            tailscale status
            tailscale ip

workflows:
  version: 2

  build-and-deploy:
    jobs:
      - test:
          filters:
            branches:
              only:
                - main
                - master

      - build-and-push:
          context: identity-service
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - master

      - trigger-deploy:
          context: identity-service
          requires:
            - build-and-push
          filters:
            branches:
              only:
                - main
                - master

  tailscale-test:
    jobs:
      - tailscale-test:
          context:
            - deploy-ops
